<title>Larry vs Lamps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{color-scheme:light;--bg:#f4f5f7;--surface:#fff;--ink:#131518;--ink-2:#4d5461;--line:#e4e7ec;--a:#2a78d6;--b:#eb6834}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1114;--surface:#181b20;--ink:#f1f3f6;--ink-2:#aeb5c0;--line:#282d35;--a:#3987e5;--b:#d95926}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1114;--surface:#181b20;--ink:#f1f3f6;--ink-2:#aeb5c0;--line:#282d35;--a:#3987e5;--b:#d95926}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;padding-inline:clamp(16px,4vw,40px);padding-block:48px}
main{max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:14px}
.mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--a) 0 50%,var(--b) 50% 100%)}
h1{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
p{margin:0;color:var(--ink-2)}
a.btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;padding:10px 16px;border-radius:9px;justify-self:start}
a{color:var(--a)}
</style>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>The dashboard has moved</h1>
  <p>Larry vs Lamps now updates itself every morning, so it lives at a new address. This page no longer receives new data.</p>
  <a class="btn" href="https://maxbeuvelet.github.io/LarryVsLamps/" target="_blank" rel="noopener">Open the live dashboard</a>
  <p>Bookmark that link. The update guide is at <a href="https://claude.ai/code/artifact/0bf27ee0-305b-4b49-840d-6d02eff00b4c">the same place as before</a>.</p>
</main>
